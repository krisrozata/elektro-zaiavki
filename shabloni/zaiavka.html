{{template "gore" "Нова заявка"}}

<h1>Нова заявка</h1>
<form method="POST" action="/zaiavka" class="karta">
    <label>Име
        <input type="text" name="ime" required>
    </label>
    <label>Телефон
        <input type="tel" name="telefon" required>
    </label>
    <label>Адрес
        <input type="text" name="adres">
    </label>
    <label>Вид работа
        <select name="vid">
            <option value="Ремонт">Ремонт</option>
            <option value="Монтаж">Монтаж</option>
            <option value="Проверка на инсталация">Проверка на инсталация</option>
        </select>
    </label>
    <label>Какъв е проблемът
        <textarea name="opisanie" rows="4"></textarea>
    </label>
    <button type="submit" class="buton">Изпрати заявката</button>
</form>

{{template "dolu"}}
