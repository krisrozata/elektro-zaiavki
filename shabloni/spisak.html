{{template "gore" "Заявки"}}

<h1>Заявки <small>({{.Broi}})</small></h1>

<div class="karta tablica-obvivka">
    <table>
        <tr>
            <th>№</th><th>Име</th><th>Телефон</th><th>Адрес</th>
            <th>Вид</th><th>Проблем</th><th>Дата</th><th>Статус</th>
        </tr>
        {{range .Zaiavki}}
        {{$z := .}}
        <tr>
            <td>{{.ID}}</td>
            <td>{{.Ime}}</td>
            <td><a href="tel:{{.Telefon}}">{{.Telefon}}</a></td>
            <td>{{.Adres}}</td>
            <td>{{.Vid}}</td>
            <td>{{.Opisanie}}</td>
            <td>{{.Suzdadena.Format "02.01.2006 15:04"}}</td>
            <td>
                <form method="POST" action="/zaiavki/{{.ID}}/status">
                    <select name="status">
                        {{range $.Statusi}}
                        <option value="{{.}}" {{if eq . $z.Status}}selected{{end}}>{{.}}</option>
                        {{end}}
                    </select>
                    <button type="submit" class="buton buton-malak">Запази</button>
                </form>
            </td>
        </tr>
        {{else}}
        <tr><td colspan="8">Още няма заявки.</td></tr>
        {{end}}
    </table>
</div>

{{template "dolu"}}
